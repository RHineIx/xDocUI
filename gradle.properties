# Enable R8 full mode for aggressive shrinking and optimization
android.enableR8.fullMode=true

# Disable AndroidX jetifier since modern projects use AndroidX natively
android.enableJetifier=false
android.useAndroidX=true

# Optimize JVM memory for the build process
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Disable unnecessary build features to save space and time
android.buildFeatures.buildConfig=false