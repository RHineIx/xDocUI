name: 🚀 Build & Release xDocUI

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: '📦 Select Release Channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - pre-release

permissions:
  contents: write

# Cancel any previous runs of this workflow on the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    name: 🔨 Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Prevent hanging workflows

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for auto-generating release notes

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle (No Cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Explicitly disable caching as requested for a completely clean production build
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: 🏷️ Extract Version Information
        run: |
          # Robustly extract versionCode and versionName from app/build.gradle.kts
          VERSION_CODE=$(grep -m 1 'versionCode\s*=\s*' app/build.gradle.kts | grep -o '[0-9]\+')
          VERSION_NAME=$(grep -m 1 'versionName\s*=\s*' app/build.gradle.kts | cut -d'"' -f2)
          
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "❌ Error: Could not extract version info!"
            exit 1
          fi
          
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          
          # Configure variables based on the selected release channel
          if [ "${{ github.event.inputs.release_type }}" == "stable" ]; then
            echo "TAG_NAME=v${VERSION_NAME}" >> $GITHUB_ENV
            echo "RELEASE_NAME=xDocUI v${VERSION_NAME} (Stable)" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v${VERSION_NAME}-rc" >> $GITHUB_ENV
            echo "RELEASE_NAME=xDocUI v${VERSION_NAME} (Release Candidate)" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: 🔐 Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ ! -z "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 --decode > keystore.jks
          else
            echo "::error::SIGNING_KEY is required to publish a release."
            exit 1
          fi

      - name: 🛠️ Build Optimized APK
        env:
          SIGNING_KEY_FILE: ${{ github.workspace }}/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash ./gradlew clean testDebugUnitTest lintDebug assembleRelease --no-daemon --parallel --no-build-cache

      - name: 🧹 Secure Keystore Cleanup
        if: always() # Ensure this runs even if the build fails
        run: rm -f keystore.jks

      - name: Verify release APK
        run: python3 .github/scripts/verify_release.py app/build/outputs/apk/release

      - name: 📦 Locate and Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f)
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH"
          TARGET_NAME="xDocUI-${{ env.TAG_NAME }}-arm64-v8a.apk"
          mv "$APK_PATH" "$TARGET_NAME"
          echo "APK_FINAL_PATH=$TARGET_NAME" >> $GITHUB_ENV

      - name: 📤 Upload Artifact (Actions Panel)
        uses: actions/upload-artifact@v4
        with:
          name: xDocUI-APK-${{ env.TAG_NAME }}-arm64-v8a
          path: ${{ env.APK_FINAL_PATH }}
          if-no-files-found: error
          retention-days: 14 # Keep artifact for 14 days in the Actions tab

      - name: 🎉 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
          body: |
            ### 🚀 xDocUI Automated Release
            
            - **Version:** ${{ env.VERSION_NAME }} (Code: ${{ env.VERSION_CODE }})
            - **Channel:** ${{ github.event.inputs.release_type }}
            - **ABI:** arm64-v8a only
            - **Build Configuration:** R8 optimized, obfuscated and signed
            - **Sorting:** Native transitions, structural resolution and lazy DexKit fallback
            - **Framework:** Modern libxposed API 102
            
            > **Note:** This module bypasses storage restrictions and forces persistent sorting in DocumentsUI. Requires a modern Xposed framework (LibXposed API 102).
          files: ${{ env.APK_FINAL_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}