name: 🚀 Build & Release xDocUI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Cancel any previous runs of this workflow on the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: 🔨 Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Prevent hanging workflows

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for tag ancestry and release notes

      - name: Validate release tag and version
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi
          TAG_NAME="$GITHUB_REF_NAME"
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(-rc)?$ ]]; then
            echo "::error::Invalid release tag. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc."
            exit 1
          fi
          VERSION_NAME="${TAG_NAME#v}"
          VERSION_NAME="${VERSION_NAME%-rc}"
          if [[ "$TAG_NAME" == *-rc ]]; then
            IS_PRERELEASE=true
            RELEASE_NAME="xDocUI $TAG_NAME (Release Candidate)"
            RELEASE_CHANNEL=pre-release
          else
            IS_PRERELEASE=false
            RELEASE_NAME="xDocUI $TAG_NAME (Stable)"
            RELEASE_CHANNEL=stable
          fi
          printf 'VERSION_NAME=%s\nTAG_NAME=%s\nRELEASE_NAME=%s\nIS_PRERELEASE=%s\nRELEASE_CHANNEL=%s\n' \
            "$VERSION_NAME" "$TAG_NAME" "$RELEASE_NAME" "$IS_PRERELEASE" "$RELEASE_CHANNEL" >> "$GITHUB_ENV"

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle (No Cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Explicitly disable caching as requested for a completely clean production build
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: 🔐 Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ ! -z "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 --decode > keystore.jks
          else
            echo "::error::SIGNING_KEY is required to publish a release."
            exit 1
          fi

      - name: 🛠️ Build Optimized APK
        env:
          SIGNING_KEY_FILE: ${{ github.workspace }}/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash ./gradlew clean testDebugUnitTest lintDebug assembleRelease -PreleaseTag="$TAG_NAME" --no-daemon --parallel --no-build-cache

      - name: 🧹 Secure Keystore Cleanup
        if: always() # Ensure this runs even if the build fails
        run: rm -f keystore.jks

      - name: Verify release APK
        run: python3 .github/scripts/verify_release.py app/build/outputs/apk/release

      - name: 📦 Locate and Rename APK
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f)
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH"
          badging=$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK_PATH")
          package_line=$(sed -n '/^package: /p' <<< "$badging")
          actual_name=$(sed -nE "s/.*versionName='([^']+)'.*/\1/p" <<< "$package_line")
          VERSION_CODE=$(sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" <<< "$package_line")
          if [[ "$actual_name" != "$VERSION_NAME" || ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Packaged APK version does not match the release tag."
            exit 1
          fi
          printf 'VERSION_CODE=%s\n' "$VERSION_CODE" >> "$GITHUB_ENV"
          TARGET_NAME="xDocUI-${{ env.TAG_NAME }}-arm64-v8a.apk"
          mv "$APK_PATH" "$TARGET_NAME"
          echo "APK_FINAL_PATH=$TARGET_NAME" >> $GITHUB_ENV

      - name: 📤 Upload Artifact (Actions Panel)
        uses: actions/upload-artifact@v4
        with:
          name: xDocUI-APK-${{ env.TAG_NAME }}-arm64-v8a
          path: ${{ env.APK_FINAL_PATH }}
          if-no-files-found: error
          retention-days: 14 # Keep artifact for 14 days in the Actions tab

      - name: 🎉 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
          body: |
            ### 🚀 xDocUI Automated Release
            
            - **Version:** ${{ env.VERSION_NAME }} (Code: ${{ env.VERSION_CODE }})
            - **Channel:** ${{ env.RELEASE_CHANNEL }}
            - **ABI:** arm64-v8a only
            - **Build Configuration:** R8 optimized, obfuscated and signed
            - **Sorting:** Native transitions, structural resolution and lazy DexKit fallback
            - **Framework:** Modern libxposed API 102
            
            > **Note:** This module bypasses storage restrictions and forces persistent sorting in DocumentsUI. Requires a modern Xposed framework (LibXposed API 102).
          files: ${{ env.APK_FINAL_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}